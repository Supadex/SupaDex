[profile.default]
src = "contract"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1000000
# Read-only access so DeploySupaDex.t.sol can assert the scripts never print readiness claims (Jexi 019).
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 1024
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
lint_on_build = false

# Fast local iteration profile (same compiler + via_ir; lower optimizer runs). CI/default stays unchanged.
[profile.dev]
src = "contract"
out = "out-dev"
cache_path = "cache-dev"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200

# Legacy (non via-IR) pipeline: what `forge coverage` uses. Must compile for coverage to work (Issue 5).
[profile.legacy]
src = "contract"
out = "out-legacy"
cache_path = "cache-legacy"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200

# CI profile (Edith remediation-3 condition 1): same compiler pipeline as default, with a PINNED fuzz seed so CI is
# reproducible. Randomised seeds run in the separate `fuzz-random-seed` job (.github/workflows/test.yml), which
# prints its seed so any failure can be replayed with `FOUNDRY_PROFILE=ci forge test --fuzz-seed <seed>`.
[profile.ci.fuzz]
runs = 4096
max_test_rejects = 262144
seed = "0x5eed2026"

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = false

# T-6 strict-revert profile: ONLY this profile sets fail_on_revert = true. The global
# [invariant] and [profile.ci.invariant] sections stay false (founder constraint):
# CrossProtocolInvariant handlers intentionally encounter expected economic reverts
# (slippage, liquidity constraints, configured bounds), and a global flip would turn
# legitimate economics into false positives. The strict suite
# (test/invariant/StrictRevertInvariant.t.sol) runs under this profile; its handlers
# catch every revert and classify it through test/invariant/RevertClassifier.sol, so
# any uncaught revert fails the run here AND any classified-unexpected revert fails
# invariant_noUnexpectedReverts under every profile.
[profile.strict.invariant]
runs = 256
depth = 128
fail_on_revert = true

[profile.strict.fuzz]
runs = 1024
