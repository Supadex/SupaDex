[profile.default]
src = "contract"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1000000
# Read-only access so DeploySupaDex.t.sol can assert the scripts never print readiness claims (Jexi 019).
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 1024
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
lint_on_build = false

# Fast local iteration profile (same compiler + via_ir; lower optimizer runs). CI/default stays unchanged.
[profile.dev]
src = "contract"
out = "out-dev"
cache_path = "cache-dev"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200

# Legacy (non via-IR) pipeline: what `forge coverage` uses. Must compile for coverage to work (Issue 5).
[profile.legacy]
src = "contract"
out = "out-legacy"
cache_path = "cache-legacy"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200

# Halmos profile (T-5, audit closure): inherits the whole default compiler
# pipeline and overrides exactly one setting. Foundry 1.10 dynamically links
# `new` deployments inside test contracts through vm.deployCode by default
# ("dynamic test linking"), and Halmos 0.3.3 does not implement the deployCode
# cheatcode, so any formal test that deploys a contract (e.g. CircuitBreaker)
# fails in setUp() under the default profile. Disabling it here makes every
# `new` compile to a plain CREATE, which Halmos executes. Scoped to this
# profile only: default / ci / dev / legacy compilation is unchanged.
# NOTE: the setting cannot be passed to Halmos's internal `forge build` via a
# CLI flag (Halmos has no build-args passthrough) and neither
# FOUNDRY_NO_DYNAMIC_TEST_LINKING nor NO_DYNAMIC_TEST_LINKING is honoured by
# forge 1.10.0 (both verified to have no effect, 26 Nov 2026), so a profile
# is the only declarative route. [invariant] / [profile.ci.invariant] untouched.
[profile.halmos]
dynamic_test_linking = false

# CI profile (Edith remediation-3 condition 1): same compiler pipeline as default, with a PINNED fuzz seed so CI is
# reproducible. Randomised seeds run in the separate `fuzz-random-seed` job (.github/workflows/test.yml), which
# prints its seed so any failure can be replayed with `FOUNDRY_PROFILE=ci forge test --fuzz-seed <seed>`.
[profile.ci.fuzz]
runs = 4096
max_test_rejects = 262144
seed = "0x5eed2026"

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = false
